<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Post | CodeLearn Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.14), transparent 30%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.10), transparent 30%),
                #080b14;
            color: #f8fafc;
        }

        .page-wrapper {
            min-height: 100vh;
            padding: 45px 20px;
        }

        .container-box {
            max-width: 850px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .brand {
            color: #a5b4fc;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
        }

        .update-card {
            background: rgba(17, 24, 39, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .card-header-custom {
            padding: 30px 35px;
            background: linear-gradient(
                135deg,
                rgba(99, 102, 241, 0.18),
                rgba(139, 92, 246, 0.08)
            );
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .icon-box {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 24px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
        }

        .card-header-custom h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .card-header-custom p {
            margin: 8px 0 0;
            color: #94a3b8;
        }

        .card-body-custom {
            padding: 35px;
        }

        .form-area p {
            margin-bottom: 22px;
        }

        .form-area label {
            display: block;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-area input,
        .form-area textarea,
        .form-area select {
            width: 100%;
            padding: 13px 15px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #273449;
            border-radius: 12px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-area textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-area input:focus,
        .form-area textarea:focus,
        .form-area select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .form-area input[type="file"] {
            padding: 10px;
        }

        .form-area input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .form-area .helptext {
            display: block;
            margin-top: 6px;
            color: #64748b;
            font-size: 13px;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 6px 0;
            color: #f87171;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-update,
        .btn-cancel {
            padding: 13px 22px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-update {
            flex: 1;
            border: none;
            color: white;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        .btn-update:hover {
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
        }

        .btn-cancel {
            border: 1px solid #334155;
            color: #cbd5e1;
            background: #111827;
        }

        .btn-cancel:hover {
            background: #1e293b;
            color: white;
        }

        .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            .page-wrapper {
                padding: 25px 15px;
            }

            .card-header-custom,
            .card-body-custom {
                padding: 25px;
            }

            .top-bar {
                margin-bottom: 18px;
            }

            .actions {
                flex-direction: column;
            }

            .btn-cancel {
                order: 2;
            }

            .btn-update {
                order: 1;
            }
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="container-box">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <i class="bi bi-code-slash"></i>
                CodeLearn Hub
            </div>

            <a href="{% url 'blog:blogpage' %}" class="back-link">
                <i class="bi bi-arrow-left"></i>
                Back to Courses
            </a>
        </div>

        <!-- Update Card -->
        <div class="update-card">

            <div class="card-header-custom">

                <div class="icon-box">
                    <i class="bi bi-pencil-square"></i>
                </div>

                <h1>Update Post</h1>

                <p>
                    Edit your course details and keep your content up to date.
                </p>

            </div>

            <div class="card-body-custom">

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="form-area">
                        {{ form.as_p }}
                    </div>

                    <div class="actions">

                        <a href="{% url 'blog:blogpage' %}"
                           class="btn-cancel">
                            <i class="bi bi-x-lg"></i>
                            Cancel
                        </a>

                        <button type="submit" class="btn-update">
                            <i class="bi bi-check-lg"></i>
                            Update Post
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <div class="footer-note">
            CodeLearn Hub • Learn. Build. Grow.
        </div>

    </div>

</div>

</body>
</html>
