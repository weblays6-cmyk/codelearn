{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Comment | {{ SITE_NAME }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #070816;

            color: #f5f7ff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* ===============================
           BACKGROUND GLOW
        =============================== */

        body::before {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(111, 76, 255, .08);

            filter: blur(30px);

            top: -200px;
            right: -150px;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(45, 117, 255, .06);

            filter: blur(30px);

            bottom: -150px;
            left: -100px;

            pointer-events: none;
        }


        /* ===============================
           CONTAINER
        =============================== */

        .page {

            width: 100%;

            max-width: 620px;

            padding: 25px;

            position: relative;

            z-index: 2;
        }


        /* ===============================
           LOGO
        =============================== */

        .logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 22px;
        }


        .logo-icon {

            width: 42px;
            height: 42px;

            border-radius: 13px;

            background:
                linear-gradient(135deg,
                    #805cff,
                    #4d8dff);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 20px;

            box-shadow:
                0 10px 30px rgba(89, 76, 255, .25);
        }


        .logo-text {

            font-size: 19px;

            font-weight: 850;

            line-height: 1.05;
        }


        .logo-text span {

            display: block;

            color: #a991ff;
        }


        /* ===============================
           CARD
        =============================== */

        .delete-card {

            background:
                linear-gradient(145deg,
                    #131525,
                    #0c0e1b);

            border: 1px solid #2b2e45;

            border-radius: 22px;

            padding: 32px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .35);
        }


        /* ===============================
           ICON
        =============================== */

        .warning-icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 20px;

            background:
                rgba(255, 83, 105, .10);

            border:
                1px solid rgba(255, 83, 105, .22);

            color: #ff7185;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;
        }


        /* ===============================
           TITLE
        =============================== */

        h1 {

            font-size: 25px;

            font-weight: 850;

            margin: 0 0 10px;
        }


        .subtitle {

            color: #737a94;

            font-size: 11px;

            line-height: 1.7;

            margin-bottom: 22px;
        }


        /* ===============================
           COMMENT
        =============================== */

        .comment-box {

            text-align: left;

            background: #0b0e1b;

            border: 1px solid #292c42;

            border-radius: 14px;

            padding: 18px;

            margin-bottom: 24px;
        }


        .comment-label {

            color: #666d86;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1px;

            font-weight: 700;

            margin-bottom: 9px;
        }


        .comment-content {

            color: #dfe2ed;

            font-size: 12px;

            line-height: 1.6;

            word-break: break-word;
        }


        /* ===============================
           WARNING
        =============================== */

        .warning-text {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            color: #aeb3c5;

            font-size: 10px;

            margin-bottom: 22px;
        }


        .warning-text i {

            color: #ff7185;
        }


        /* ===============================
           ACTIONS
        =============================== */

        .actions {

            display: flex;

            gap: 12px;

            justify-content: center;
        }


        .btn {

            min-width: 145px;

            padding: 11px 18px;

            border-radius: 10px;

            font-size: 10px;

            font-weight: 750;

            text-decoration: none;

            border: none;

            cursor: pointer;

            transition: .2s;
        }


        .delete-btn {

            color: white;

            background:
                linear-gradient(135deg,
                    #ef4765,
                    #d93656);

            box-shadow:
                0 8px 25px rgba(239, 71, 101, .16);
        }


        .delete-btn:hover {

            transform: translateY(-1px);

            opacity: .9;
        }


        .cancel-btn {

            color: #c0c4d3;

            background: #151827;

            border: 1px solid #303348;
        }


        .cancel-btn:hover {

            color: white;

            border-color: #555a73;

            background: #1b1e31;
        }


        /* ===============================
           FOOTER
        =============================== */

        .footer {

            text-align: center;

            color: #484e65;

            font-size: 9px;

            margin-top: 18px;
        }


        /* ===============================
           MOBILE
        =============================== */

        @media(max-width: 550px) {

            .page {

                padding: 18px;
            }

            .delete-card {

                padding: 25px 20px;
            }

            .actions {

                flex-direction: column;
            }

            .btn {

                width: 100%;
            }

        }
    </style>

</head>


<body>


    <div class="page">


        <!-- LOGO -->

        <div class="logo">
            <img class="site-logo site-logo--compact"
                style="display:block;width:180px;max-width:100%;height:auto;object-fit:contain;padding:2px 4px;border-radius:3px;background:#fff;"
                src="{% static 'images/vgrowhub-logo.svg' %}" alt="{{ SITE_NAME }}">
        </div>


        <!-- DELETE CARD -->

        <div class="delete-card">


            <div class="warning-icon">

                <i class="bi bi-trash3"></i>

            </div>


            <h1>
                Delete Comment?
            </h1>


            <p class="subtitle">

                Are you sure you want to permanently
                delete this comment?

                <br>

                This action cannot be undone.

            </p>


            <!-- COMMENT -->

            <div class="comment-box">


                <div class="comment-label">

                    <i class="bi bi-chat-left-text"></i>

                    Comment

                </div>


                <div class="comment-content">

                    "{{ comment.content }}"

                </div>


            </div>


            <!-- WARNING -->

            <div class="warning-text">

                <i class="bi bi-exclamation-triangle"></i>

                This comment will be permanently removed.

            </div>


            <!-- ACTIONS -->

            <div class="actions">


                <a href="{% url 'blog:post_detail' comment.post.pk %}" class="btn cancel-btn">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>


                <form method="POST" style="margin:0;">

                    {% csrf_token %}

                    <button type="submit" class="btn delete-btn">

                        <i class="bi bi-trash3"></i>

                        Yes, Delete

                    </button>

                </form>


            </div>


        </div>


        <div class="footer">

            {{ SITE_NAME }} · Learn. Practice. Build.

        </div>


    </div>


</body>

</html>
