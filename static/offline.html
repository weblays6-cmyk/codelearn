<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2F5BEA">
    <title>You're offline | vGrowHub</title>
    <style>
        :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #0F172A; background: #F5F7FB; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
        main { max-width: 440px; padding: 32px; border: 1px solid #E2E8F0; border-radius: 18px; background: #fff; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 26px; }
        p { color: #475569; line-height: 1.6; }
        button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: #2F5BEA; color: white; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Reconnect to the internet and try opening vGrowHub again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
